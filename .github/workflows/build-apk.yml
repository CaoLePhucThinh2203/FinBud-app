name: Build Android APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch: # Cho phép bấm nút Build thủ công trên giao diện GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Tải mã nguồn
        uses: actions/checkout@v4

      - name: 2. Cài Java JDK 21 (Capacitor 8 yêu cầu)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle

      - name: 3. Cài Node.js 22 (Capacitor CLI 8 yêu cầu)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 4. Cài dependencies
        run: npm ci || npm install

      - name: 5. Đồng bộ web (www) vào dự án Android
        # Dự án đã có sẵn thư mục android/ nên chỉ cần sync, KHÔNG chạy "cap add android"
        run: npx cap sync android

      - name: 6. Build APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 7. Đưa file APK lên GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FinBud-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
