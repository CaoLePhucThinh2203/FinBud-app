<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f9d7a">
<title>FinBud</title>
<style>
:root{--bg:#eef2f1;--card:#fff;--tx:#14211e;--mut:#6b7c77;--line:#e2e9e7;--pri:#0f9d7a;--pri2:#d9f3ec;--ok:#12a36b;--warn:#e0a100;--bad:#d9402f;--ph:#fff;--sat:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));--sab:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px))}
@media(prefers-color-scheme:dark){:root{--bg:#0b1211;--card:#16201e;--tx:#e8f1ee;--mut:#8ea39d;--line:#243230;--pri2:#123a31;--ph:#101917}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;align-items:center}
.phone{width:100%;max-width:400px;height:100%;max-height:820px;background:var(--ph);position:relative;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:28px;padding-top:var(--sat)}
@media(max-width:430px){.phone{border-radius:0;border:0;max-height:none}}
.scr,.panel{scrollbar-width:none}.scr::-webkit-scrollbar,.panel::-webkit-scrollbar{display:none}
.scr{flex:1;overflow-y:auto;padding:16px 16px calc(90px + var(--sab));overscroll-behavior:contain}
h1{font-size:18px;margin:0}h2{font-size:14px;margin:18px 0 8px}
.mut{color:var(--mut);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.widget{color:#fff;border-radius:22px;padding:18px;transition:background .4s;background:var(--ok);margin-top:12px}
.widget.warn{background:var(--warn)}.widget.bad{background:var(--bad)}
.widget .big{font-size:36px;font-weight:800;margin:4px 0}
.bar{height:8px;background:rgba(255,255,255,.3);border-radius:8px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:#fff;border-radius:8px;transition:width .5s}
.wrow{display:flex;gap:8px;margin-top:12px}
.wb{flex:1;border:0;border-radius:12px;padding:12px;background:rgba(255,255,255,.22);color:#fff;font-weight:600;font-size:14px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.ic{width:38px;height:38px;border-radius:12px;background:var(--pri2);display:grid;place-items:center;font-size:18px}
.row .m{flex:1;min-width:0}.row .m b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;font-size:14px}
.tag{font-size:10px;background:var(--pri2);color:var(--pri);padding:2px 6px;border-radius:6px;margin-left:4px;font-weight:600}
.cat{display:flex;align-items:center;gap:8px;font-size:12px;margin:6px 0}.cat span:first-child{width:92px}.cat .t{flex:1;height:8px;background:var(--line);border-radius:6px;overflow:hidden}.cat .t i{display:block;height:100%;background:var(--pri)}
nav{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:8px 8px calc(8px + var(--sab))}
nav button{flex:1;border:0;background:none;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}nav button.on{color:var(--pri);font-weight:700}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:700;font-size:14px;background:var(--pri);color:#fff}.btn.g{background:var(--pri2);color:var(--pri)}.btn.r{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:5}.sheet.show{display:flex}
.panel{background:var(--card);width:100%;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + var(--sab));max-height:94%;overflow:auto}
.wave{display:flex;gap:4px;justify-content:center;align-items:center;height:50px}
.wave i{width:5px;background:var(--pri);border-radius:4px;height:10px;animation:w 1s ease-in-out infinite}@keyframes w{50%{height:40px}}.wave.off i{animation:none;opacity:.3}
input,select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--tx);border-radius:12px;padding:11px;font-size:15px}
.res{background:var(--pri2);border-radius:14px;padding:12px;margin-top:10px}.res input,.res select{margin-top:8px}
.cam{height:230px;background:#1b2523;border-radius:16px;position:relative;display:grid;place-items:center;color:#9fb3ad;font-size:13px;overflow:hidden;text-align:center;padding:0 20px}
.cam img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.cam .fr{position:absolute;inset:22px 40px;border:2px dashed #7fe0c5;border-radius:10px;z-index:2}
.laser{position:absolute;left:30px;right:30px;height:3px;background:#3ef0c0;box-shadow:0 0 12px #3ef0c0;top:20px;animation:l 1.2s linear infinite;display:none;z-index:3}.scanning .laser{display:block}@keyframes l{to{top:205px}}
.toast{position:absolute;left:50%;bottom:calc(84px + var(--sab));transform:translateX(-50%);background:#14211e;color:#fff;padding:9px 14px;border-radius:20px;font-size:13px;opacity:0;transition:.3s;z-index:9;pointer-events:none;max-width:90%;text-align:center}.toast.show{opacity:1}
label.s{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;font-size:14px}label.s input{width:150px;text-align:right}
</style>
</head>
<body>
<div class="phone">
 <div class="scr" id="scr"></div>
 <nav>
  <button data-t="home" class="on"><span>🏠</span>Trang chủ</button>
  <button data-t="hist"><span>🧾</span>Lịch sử</button>
  <button data-t="set"><span>⚙️</span>Cài đặt</button>
 </nav>
 <div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
 <div class="toast" id="toast"></div>
</div>
<script>
const K="finbud.v1",CATS={food:["🍜","Ăn uống"],move:["🛵","Di chuyển"],study:["📚","Học tập"],shop:["🛍️","Mua sắm"],other:["💸","Khác"]};
let S={set:null,tx:[],tab:"home"},dr=null,tm=null,lock=false,isListening=false;
try{const j=JSON.parse(localStorage.getItem(K)||"null");if(j)S={...S,set:j.set,tx:j.tx||[]}}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify({set:S.set,tx:S.tx}))}catch(e){}};
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,"0"),sum=a=>a.reduce((x,t)=>x+t.a,0);
const ds=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fmt=n=>Math.round(n).toLocaleString("vi-VN")+"đ";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=x=>+String(x).replace(/[.,]/g,"");
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}

/* Hạn mức chi tiêu ngày = (Ngân sách − Chi phí cố định − Đã chi trước hôm nay) ÷ số ngày còn lại (gồm hôm nay) */
function calc(){
 const n=new Date(),td=ds(n),ym=td.slice(0,7),dim=new Date(n.getFullYear(),n.getMonth()+1,0).getDate(),left=dim-n.getDate()+1;
 const m=S.tx.filter(t=>t.d.startsWith(ym)),spent=sum(m),tdy=sum(m.filter(t=>t.d===td)),pool=S.set.budget-S.set.fixed;
 const limit=Math.max((pool-(spent-tdy))/left,0),rem=limit-tdy;
 return{n,left,m,spent,tdy,limit,rem,ratio:limit>0?tdy/limit:(tdy>0?2:1),tomorrow:left>1?Math.max((pool-spent)/(left-1),0):0};
}
/* Phân loại danh mục & bóc tách số tiền (hỗ trợ: 15k, hai chục, 5 xị, nửa triệu, ba lăm nghìn, 45.000 VND) */
function classify(s){s=s.toLowerCase();
 if(/ăn|bún|cơm|phở|trà sữa|cà phê|cafe|bánh|nước|xôi|uống|quán/.test(s))return"food";
 if(/xe|xăng|grab|bus|buýt|taxi|be /.test(s))return"move";
 if(/sách|photo|học|in ấn|văn phòng/.test(s))return"study";
 if(/mua|áo|quần|siêu thị|shop|giày/.test(s))return"shop";return"other"}
const W={"một":1,hai:2,ba:3,"bốn":4,"năm":5,"sáu":6,"bảy":7,"tám":8,"chín":9,"mười":10},U={k:1e3,"nghìn":1e3,"ngàn":1e3,"xị":1e5,"chục":1e4,"triệu":1e6,tr:1e6};
function parseAmt(t){
 const s=t.toLowerCase(),cut=m=>(s.slice(0,m.index)+" "+s.slice(m.index+m[0].length)).replace(/\s+/g," ").trim();
 let m=s.match(/nửa triệu/);if(m)return{a:5e5,n:cut(m)};
 m=s.match(/(?<![\p{L}\d])(\d+(?:[.,]\d+)?|một|hai|ba|bốn|năm|sáu|bảy|tám|chín|mười)(?:\s*(lăm|mươi))?\s*(k|nghìn|ngàn|xị|chục|triệu|tr)(\s*rưỡi)?(?![\p{L}])/u);
 if(m){let n=m[1] in W?W[m[1]]:parseFloat(m[1].replace(",","."));if(m[2]==="lăm")n=n*10+5;else if(m[2]==="mươi")n=n*10;
  const u=U[m[3]];return{a:Math.round(n*u+(m[4]?u/2:0)),n:cut(m)}}
 m=s.match(/(\d{1,3}(?:[.,]\d{3})+|\d+)\s*(?:vnd|vnđ|đ)(?![\p{L}])/u)||s.match(/\d{1,3}(?:[.,]\d{3})+|\d+/);
 if(m){let a=num(m[1]||m[0]);if(a<1000)a*=1000;return{a,n:cut(m)}}
 return{a:0,n:s}}
function receiptTotal(t){let best=0;const ns=s=>(s.match(/\d{1,3}(?:[.,]\d{3})+|\d{4,}/g)||[]).map(num);
 for(const l of t.split("\n"))if(/t[oổ]ng|total|thanh to[aá]n|amount|c[ộo]ng/i.test(l)){const n=ns(l);if(n.length)best=Math.max(best,...n)}
 if(!best){const n=(t.match(/\d{1,3}(?:[.,]\d{3})+/g)||[]).map(num);if(n.length)best=Math.max(...n)}return best}

const row=(t,del)=>`<div class="row" ${del?`onclick="del(${t.id})"`:""}><div class="ic">${CATS[t.c][0]}</div><div class="m"><b>${esc(t.n)}</b><span class="mut">${CATS[t.c][1]} · ${t.d.slice(8)}/${t.d.slice(5,7)}<span class="tag">${t.s}</span></span></div><div class="amt">-${fmt(t.a)}</div></div>`;
function render(){
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===S.tab));
 if(!S.set){setup();return}
 const c=calc(),sc=$("#scr");
 if(S.tab==="home"){
  const cls=c.ratio>1?"bad":c.ratio>=.8?"warn":"",by={};c.m.forEach(t=>by[t.c]=(by[t.c]||0)+t.a);const mx=Math.max(1,...Object.values(by));
  sc.innerHTML=`<h1>Chào ${esc(S.set.name||"bạn")} 👋</h1><div class="mut">${c.n.toLocaleString("vi-VN",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"})} · còn ${c.left} ngày</div>
  <div class="widget ${cls}"><div style="font-size:13px;opacity:.9">Hôm nay bạn có thể chi tiêu:</div>
   <div class="big">${c.rem>=0?fmt(c.rem):"Vượt "+fmt(-c.rem)}</div>
   <div class="bar"><i style="width:${Math.min(100,c.ratio*100)}%"></i></div>
   <div style="font-size:12px">Đã chi ${fmt(c.tdy)} / hạn mức ${fmt(c.limit)}${c.ratio>1?" · ⚠️ Cảnh báo lạm chi":""}</div>
   <div class="wrow"><button class="wb" onclick="quick()">🎤 Nói / gõ</button><button class="wb" onclick="ocr()">📷 Quét hóa đơn</button></div></div>
  <div class="card" style="margin-top:12px;font-size:13px">📈 Ngày mai hạn mức dự kiến: <b>${fmt(c.tomorrow)}</b><div class="mut" style="margin-top:4px">${c.rem<0?"Phần thâm hụt được chia đều vào các ngày còn lại.":"Tiền dư hôm nay được dồn sang các ngày sau."}</div></div>
  <h2>Chi tiêu tháng này theo danh mục</h2><div class="card">${Object.keys(by).length?Object.entries(by).map(([k,v])=>`<div class="cat"><span>${CATS[k][0]} ${CATS[k][1]}</span><div class="t"><i style="width:${v/mx*100}%"></i></div><b>${Math.round(v/1000)}k</b></div>`).join(""):'<div class="mut">Chưa có chi tiêu nào.</div>'}</div>
  <h2>Giao dịch gần đây</h2><div class="card">${S.tx.length?S.tx.slice(0,4).map(t=>row(t)).join(""):'<div class="mut">Bấm 🎤 hoặc 📷 để thêm giao dịch đầu tiên.</div>'}</div>`;
 }else if(S.tab==="hist"){
  sc.innerHTML=`<h1>Lịch sử giao dịch</h1><div class="mut" style="margin:4px 0 12px">Tháng này: ${c.m.length} giao dịch · ${fmt(c.spent)} · chạm vào giao dịch để xóa</div><div class="card">${S.tx.length?S.tx.map(t=>row(t,1)).join(""):'<div class="mut">Chưa có giao dịch.</div>'}</div>`;
 }else{
  sc.innerHTML=`<h1>Cài đặt</h1><h2>Ngân sách tháng</h2><div class="card">
  <label class="s">Tên<input value="${esc(S.set.name||"")}" onchange="S.set.name=this.value.trim();save();toast('Đã lưu')"></label>
  <label class="s">Ngân sách khả dụng<input type="number" inputmode="numeric" value="${S.set.budget}" onchange="S.set.budget=+this.value||0;save();toast('Đã lưu')"></label>
  <label class="s">Chi phí cố định<input type="number" inputmode="numeric" value="${S.set.fixed}" onchange="S.set.fixed=+this.value||0;save();toast('Đã lưu')"></label>
  <div class="mut">Hạn mức ngày = (Ngân sách − Chi phí cố định − Đã chi) ÷ số ngày còn lại</div></div>
  <h2>Thông báo ngân hàng <span class="tag" style="font-size:11px;padding:2px 8px;vertical-align:middle">Coming soon</span></h2><div class="card mut">Tính năng tự động đọc thông báo biến động số dư (MB, Vietcombank, MoMo…) đang được phát triển cho phiên bản tiếp theo. Tạm thời, bạn có thể dán nội dung thông báo vào ô “Nói / gõ”.</div>
  <button class="btn r" style="margin-top:14px;width:100%" onclick="if(confirm('Xóa toàn bộ dữ liệu?')){S.set=null;S.tx=[];save();render()}">Xóa toàn bộ dữ liệu</button>`;
 }
}
function del(id){if(confirm("Xóa giao dịch này?")){S.tx=S.tx.filter(t=>t.id!==id);save();render()}}
function open(h,lk){lock=!!lk;$("#panel").innerHTML=h;$("#sheet").classList.add("show")}
function closeSheet(){$("#sheet").classList.remove("show");clearInterval(tm);dr=null;if(isListening&&window.Capacitor?.Plugins?.VoskVoice){window.Capacitor.Plugins.VoskVoice.stopListening();isListening=false;}}
function setup(){open(`<h1>👋 Chào mừng đến FinBud</h1><div class="mut">Thiết lập ngân sách tháng này để biết mỗi ngày được tiêu bao nhiêu.</div>
 <label class="s">Tên của bạn<input id="sn" placeholder="Khanh"></label>
 <label class="s">Ngân sách tháng (đ)<input id="sb" type="number" inputmode="numeric" value="5000000"></label>
 <label class="s">Chi phí cố định (đ)<input id="sf" type="number" inputmode="numeric" value="1500000"></label>
 <div class="mut">Chi phí cố định: tiền nhà, học phí, internet…</div><button class="btn" style="width:100%;margin-top:12px" onclick="finishSetup()">Bắt đầu</button>`,1)}
function finishSetup(){const b=+$("#sb").value,f=+$("#sf").value||0;if(!(b>0)||f<0||f>=b){toast("Ngân sách phải lớn hơn chi phí cố định");return}
 S.set={name:$("#sn").value.trim(),budget:b,fixed:f};save();lock=false;closeSheet();render()}
/* Kết quả bóc tách: sửa được trước khi lưu; nhập nhanh tự lưu sau 3s nếu không chạm vào */
function showRes(d,target,auto){dr=d;let n=3;clearInterval(tm);
 $(target).innerHTML=`<div class="res"><div class="mut">Kiểm tra lại trước khi lưu</div><input id="ra" type="number" inputmode="numeric" value="${d.a}" placeholder="Số tiền" style="font-size:22px;font-weight:800">
 <select id="rc">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${k===d.c?"selected":""}>${v[0]} ${v[1]}</option>`).join("")}</select><input id="rn" value="${esc(d.n)}" placeholder="Ghi chú">
 <button class="btn" style="width:100%;margin-top:10px" onclick="commit()">Lưu</button><div class="mut" id="cd" style="margin-top:6px"></div></div>`;
 if(auto){const cd=$("#cd"),stop=()=>{clearInterval(tm);cd.textContent=""};cd.textContent="Tự lưu sau 3s…";
  document.querySelectorAll(".res input,.res select").forEach(e=>e.addEventListener("focus",stop));
  tm=setInterval(()=>{n--;if(n<=0)commit();else cd.textContent="Tự lưu sau "+n+"s…"},1000)}}
function commit(){if(!dr)return;const a=+$("#ra").value;if(!(a>0)){toast("Số tiền chưa hợp lệ");return}
 S.tx.unshift({id:Date.now(),a,c:$("#rc").value,n:$("#rn").value.trim()||"Chi tiêu",s:dr.s,d:ds(new Date())});save();closeSheet();render();toast("✅ Đã lưu · hạn mức đã cập nhật")}
/* --- Vosk Offline Voice Recognition & Web Speech Fallback (Bước 5) --- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

let isModelReady = false;
let isInitializingModel = false;

async function initVosk() {
  const v = window.Capacitor?.Plugins?.VoskVoice;
  if (!v || isModelReady || isInitializingModel) return;

  isInitializingModel = true;
  console.log("Đang nạp mô hình Vosk Offline...");
  try {
    await v.initModel();
    isModelReady = true;
    console.log("Vosk model đã sẵn sàng!");
  } catch (e) {
    console.warn("Lỗi nạp Vosk model:", e);
  } finally {
    isInitializingModel = false;
  }

  // Lắng nghe kết quả giọng nói
  v.removeAllListeners?.();
  v.addListener("onVoiceResult", (data) => {
    const inp = $("#qi");
    if (inp && data.text) inp.value = data.text;
    if (data.isFinal) {
      analyze("Voice Offline");
      v.stopListening();
      isListening = false;
      const wv = $("#wv"), btn = $("#mic");
      if (wv) wv.classList.add("off");
      if (btn) btn.textContent = "🎤";
    }
  });
}

// Tự động khởi tạo sau khi trang web nạp xong
if (document.readyState === "loading") {
  window.addEventListener("DOMContentLoaded", () => setTimeout(initVosk, 1000));
} else {
  setTimeout(initVosk, 1000);
}

// Logic bật / tắt Micro
async function toggleOfflineMic() {
  const v = window.Capacitor?.Plugins?.VoskVoice;
  const wv = $("#wv");
  const micBtn = $("#mic");

  if (!isModelReady) {
    toast("Đang tải mô hình tiếng Việt, vui lòng đợi 3 giây...");
    try {
      await initVosk();
    } catch (err) {
      toast("Không thể nạp mô hình: " + (err.message || err));
      return;
    }
  }

  if (!isListening) {
    try {
      await v.startListening();
      isListening = true;
      if (wv) wv.classList.remove("off");
      if (micBtn) micBtn.textContent = "⏹️";
      toast("Đang lắng nghe offline...");
    } catch (err) {
      toast("Mô hình đang khởi động, hãy thử bấm lại sau 2 giây");
    }
  } else {
    await v.stopListening();
    isListening = false;
    if (wv) wv.classList.add("off");
    if (micBtn) micBtn.textContent = "🎤";
  }
}

function quick(){
  const v = window.Capacitor?.Plugins?.VoskVoice;
  const hint = v ? "Bấm 🎤 để nói offline (Vosk AI tiếng Việt)." : (SR ? "Bấm 🎤 để nói." : "Mẹo: bấm micro trên bàn phím để đọc, rồi bấm Phân tích.");
  open(`<h1>🎤 Nhập nhanh</h1><div class="mut">Nói hoặc gõ, ví dụ “ăn bún bò 35k”, “gửi xe hai chục”, “mua áo 5 xị”. Cũng dán được nội dung thông báo ngân hàng.</div>
  <div class="wave off" id="wv">${"<i></i>".repeat(14)}</div>
  <div style="display:flex;gap:8px"><input id="qi" placeholder="ăn phở 50 nghìn" enterkeyhint="done"><button class="btn" id="mic" style="width:56px">🎤</button></div>
  <div class="mut" style="margin:6px 0">${hint}</div>
  <button class="btn" style="width:100%" onclick="analyze()">Phân tích</button><div id="qr"></div><button class="btn g" style="width:100%;margin-top:10px" onclick="closeSheet()">Đóng</button>`);
  $("#qi").onkeydown = e => { if (e.key === "Enter") analyze(); };
  $("#mic").onclick = async () => {
    const v = window.Capacitor?.Plugins?.VoskVoice;
    if (v) {
      await toggleOfflineMic();
      return;
    }
    if (!SR) {
      toast("Máy chưa hỗ trợ nhận giọng nói trong app. Dùng micro bàn phím nhé");
      $("#qi").focus();
      return;
    }
    const r = new SR();
    r.lang = "vi-VN";
    const wv = $("#wv");
    wv.classList.remove("off");
    r.onresult = e => {
      $("#qi").value = e.results[0][0].transcript;
      analyze("Voice");
    };
    r.onerror = () => toast("Không nghe rõ, bạn thử lại nhé");
    r.onend = () => wv.classList.add("off");
    try {
      r.start();
    } catch (e) {
      wv.classList.add("off");
    }
  };
}
function analyze(src){const t=$("#qi").value.trim();if(!t)return;const p=parseAmt(t);
 if(!p.a){$("#qr").innerHTML=`<div class="res">😕 Chưa thấy số tiền. Thử nói rõ hơn, ví dụ “cà phê 15k”.</div>`;return}
 showRes({a:p.a,c:classify(t),n:(p.n||"Chi tiêu").replace(/^./,x=>x.toUpperCase()),s:typeof src==="string"?src:"Nhập nhanh"},"#qr",true)}
/* Quét hóa đơn: chụp bằng camera, kiểm tra độ mờ, OCR (Tesseract.js, tải khi cần – cần mạng lần đầu) */
let tp;const loadT=()=>tp||(tp=new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";s.onload=()=>ok(window.Tesseract);s.onerror=()=>{tp=null;no()};document.head.appendChild(s)}));
function cv(img,w){const c=document.createElement("canvas"),k=Math.min(1,w/img.naturalWidth);c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c}
function sharp(img){const c=cv(img,320),w=c.width,h=c.height,d=c.getContext("2d").getImageData(0,0,w,h).data,g=new Float32Array(w*h);
 for(let i=0;i<w*h;i++)g[i]=.299*d[4*i]+.587*d[4*i+1]+.114*d[4*i+2];let s=0,q=0,n=0;
 for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x,l=4*g[i]-g[i-1]-g[i+1]-g[i-w]-g[i+w];s+=l;q+=l*l;n++}return q/n-(s/n)**2}
function ocr(){
 open(`<h1>📷 Quét hóa đơn</h1><div class="cam" id="cam"><div class="fr"></div><div class="laser"></div><img id="pv" hidden alt=""><span id="ct">Chụp hóa đơn rõ nét, đủ sáng, thấy dòng “Tổng tiền”</span></div>
 <input type="file" id="fi" accept="image/*" capture="environment" hidden><button class="btn" style="width:100%;margin-top:12px" onclick="$('#fi').click()">📷 Mở camera</button>
 <div id="or"></div><button class="btn g" style="width:100%;margin-top:10px" onclick="closeSheet()">Đóng</button>`);
 $("#fi").onchange=e=>scan(e.target.files[0])}
async function scan(f){if(!f)return;const cam=$("#cam"),o=$("#or");cam.classList.add("scanning");$("#ct").textContent="";o.innerHTML="";
 const img=new Image();img.src=URL.createObjectURL(f);let warn="",tot=0;
 try{await img.decode();$("#pv").src=img.src;$("#pv").hidden=false}catch(e){cam.classList.remove("scanning");o.innerHTML='<div class="res">Không đọc được ảnh, hãy chụp lại.</div>';return}
 try{if(sharp(img)<40)warn='<div class="mut" style="color:var(--warn);margin-top:8px">⚠️ Ảnh có vẻ bị mờ. Nếu kết quả sai, hãy chụp lại.</div>'}catch(e){}
 try{const T=await loadT(),r=await T.recognize(cv(img,1600),"eng");tot=receiptTotal(r.data.text)}catch(e){}
 cam.classList.remove("scanning");
 o.innerHTML=warn+(tot?"":'<div class="res">Chưa đọc được tổng tiền tự động (cần mạng ở lần quét đầu). Bạn nhập tổng tiền bên dưới nhé.</div>')+'<div id="or2"></div>';
 showRes({a:tot||"",c:"shop",n:"Hóa đơn",s:"OCR"},"#or2",false)}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;render()});
$("#sheet").onclick=e=>{if(e.target.id==="sheet"&&!lock)closeSheet()};
render();
</script>
